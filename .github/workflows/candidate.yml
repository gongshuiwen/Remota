name: Linux amd64 candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            validation/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: tools/requirements-contracts.txt
      - name: Contracts and tool tests
        run: |
          python -m pip install -r tools/requirements-contracts.txt
          python tools/validate_contracts.py
          python -m unittest discover -s tools -p 'test_*.py'
          node --test tools/build.test.mjs
      - name: Candidate coordinates
        run: |
          candidate_version="0.1.0-rc.${GITHUB_RUN_NUMBER}"
          echo "REMOTA_CANDIDATE_VERSION=${candidate_version}" >> "$GITHUB_ENV"
          echo "REMOTA_CANDIDATE_DIR=dist/releases/remota-${candidate_version}-linux-amd64" >> "$GITHUB_ENV"
      - name: Build and package candidate
        run: node tools/release.mjs "$REMOTA_CANDIDATE_VERSION"
      - name: Candidate tests
        run: node --test tools/release.test.mjs tools/release-path.test.mjs
      - name: Frontend checks
        working-directory: web
        run: |
          npm run format:check
          npm run test
      - name: Go checks
        env:
          CGO_ENABLED: "1"
        run: |
          go mod verify
          go vet -mod=readonly ./...
          go test -race -mod=readonly -count=1 -timeout=150s ./...
      - name: Native validation probes
        working-directory: validation
        env:
          CGO_ENABLED: "1"
        run: |
          go mod verify
          go vet -mod=readonly ./...
          go test -race -mod=readonly -count=1 -timeout=120s ./...
      - name: Prepare browser acceptance
        working-directory: web
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          npx playwright install --with-deps chromium --no-shell
          node --input-type=module -e "import {chromium} from '@playwright/test'; console.log('REMOTA_HTTPS_CHROMIUM=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Console browser regression
        working-directory: web
        env:
          REMOTA_BROWSER_CHANNEL: chromium
        run: npm run test:browser
      - name: Accept extracted candidate
        run: node tools/verify-release.mjs "$REMOTA_CANDIDATE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remota-${{ env.REMOTA_CANDIDATE_VERSION }}-linux-amd64-${{ github.run_attempt }}
          path: |
            ${{ env.REMOTA_CANDIDATE_DIR }}/*.tar.gz
            ${{ env.REMOTA_CANDIDATE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
