# Path items for the admin channel; referenced by ../openapi.yaml.
adminLogin:
  post:
    operationId: adminLogin
    tags:
    - admin
    summary: 管理员登录
    externalDocs:
      url: ../../docs/contracts/admin.md#%E7%99%BB%E5%BD%95%E4%B8%8E%E6%B5%8F%E8%A7%88%E5%99%A8%E8%BA%AB%E4%BB%BD
    security: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/AdminLoginInput
    responses:
      '200':
        description: 管理员登录
        headers: &admin-cookie-headers
          X-Request-ID:
            $ref: ../openapi.yaml#/components/headers/X-Request-ID
          X-Remota-Epoch:
            $ref: ../openapi.yaml#/components/headers/X-Remota-Epoch
          Cache-Control:
            $ref: ../openapi.yaml#/components/headers/Cache-Control
          X-Content-Type-Options:
            $ref: ../openapi.yaml#/components/headers/X-Content-Type-Options
          Referrer-Policy:
            $ref: ../openapi.yaml#/components/headers/Referrer-Policy
          Set-Cookie:
            $ref: ../openapi.yaml#/components/headers/AdminCookie
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AdminLoginResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '405':
        $ref: ../openapi.yaml#/components/responses/MethodNotAllowed
      '413':
        $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
      '415':
        $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
      '503':
        $ref: ../openapi.yaml#/components/responses/Unavailable
adminLogout:
  post:
    operationId: adminLogout
    tags:
    - admin
    summary: 退出管理员会话
    externalDocs:
      url: ../../docs/contracts/admin.md#%E7%99%BB%E5%BD%95%E4%B8%8E%E6%B5%8F%E8%A7%88%E5%99%A8%E8%BA%AB%E4%BB%BD
    security:
    - AdminCookie: []
      CSRFToken: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Empty
    responses:
      '204':
        description: 已处理，无响应正文
        headers: *admin-cookie-headers
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '405':
        $ref: ../openapi.yaml#/components/responses/MethodNotAllowed
      '413':
        $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
      '415':
        $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
      '503':
        $ref: ../openapi.yaml#/components/responses/Unavailable
