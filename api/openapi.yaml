      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/AdminLoginInput
    AdminLoginResponse:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/AdminLoginResponse
    AdminSessionResponse:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/AdminSessionResponse
    AdminSnapshot:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/AdminSnapshot
    CallId:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CallId
    CallResultInput:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CallResultInput
    CloseInput:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CloseInput
    ConsentReduction:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/ConsentReduction
    CredentialCreate:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CredentialCreate
    CredentialId:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CredentialId
    CredentialIssue:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CredentialIssue
    CredentialRevokeResponse:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CredentialRevokeResponse
    CredentialRotate:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/CredentialRotate
    DecisionInput:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/DecisionInput
    DecisionResponse:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/DecisionResponse
    Empty:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/Empty
    Error:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/Error
    HealthResponse:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/HealthResponse
    MCPClientEndResponse:
      $ref: ../docs/contracts/schemas/messages.schema.json#/$defs/MCPClientEndResponse
    MCPClientId:
