          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 资源状态、修订或重复操作冲突。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: 会话、调用或开始许可已经结束。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 请求正文超过容量边界。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 请求媒体类型、字符集或编码不支持。
      headers:
        X-Request-ID:
