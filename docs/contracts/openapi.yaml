components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      description: access 凭据，仅用于注册设备；有效期、用途及撤销状态均需校验。
    AgentBearer:
      type: http
      scheme: bearer
      description: Agent 凭据，仅能操作所绑定设备会话。
    AdminCookie:
      type: apiKey
      in: cookie
      name: remota_admin
      description: 独立管理员会话；不接受 Bearer 替代。
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 与当前管理员 Cookie 会话绑定的 CSRF 值。
  parameters:
    sid:
      name: sid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SessionId'
    tid:
      name: tid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'
    call_id:
      name: call_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CallId'
    cid:
      name: cid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CredentialId'
    mcl_id:
      name: mcl_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MCPClientId'
    Origin:
      name: Origin
      in: header
      required: true
      description: 与配置的管理 Origin 精确匹配；包括登录在内的所有管理修改均检查。
      schema:
        type: string
  headers:
    X-Request-ID:
      description: 用于定位本次请求的随机标识。
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    X-Remota-Epoch:
      description: 本次服务进程 epoch，不是凭据。
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    Cache-Control:
      description: 动态响应禁止缓存。
      required: true
      schema:
        type: string
        const: no-store
    X-Content-Type-Options:
      description: 禁止 MIME 嗅探。
      required: true
      schema:
        type: string
        const: nosniff
    Referrer-Policy:
      description: 不发送 Referer。
      required: true
      schema:
        type: string
        const: no-referrer
    Allow:
      description: 已知路由支持的方法。
      required: true
      schema:
        type: string
        pattern: '^(GET|POST|PUT|PATCH)$'
    Retry-After:
      description: 距下一可用窗口的剩余整秒。
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    AdminCookie:
      description: 设置或清除 remota_admin；HttpOnly、SameSite=Strict、Path=/，HTTPS 时加 Secure。
      required: true
      schema:
        type: string
  responses:
    HealthReady:
      description: ready；HTTP 200。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    HealthUnavailable:
      description: degraded 或 shutting_down；HTTP 503，正文仍为 HealthResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    BadRequest:
      description: JSON、参数或未知字段无效。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 身份无效或用途不符。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Host、Origin、CSRF 或本机权限不满足。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Remota-Epoch:
          $ref: '#/components/headers/X-Remota-Epoch'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
      content:
