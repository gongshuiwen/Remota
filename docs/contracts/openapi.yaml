# Authoritative HTTP bindings. Message structures stay in schemas/messages.schema.json.
# Refresh the HTTP test index and endpoint tables: python tools/validate_contracts.py --refresh-openapi
openapi: 3.1.2
info:
  title: Remota HTTP API
  version: draft-2
  description: |
    Agent、Admin 与健康检查的 HTTP 绑定契约。消息结构复用 JSON Schema 2020-12。
    授权、期限、状态转换、UTF-8 字节、幂等及重试规则见各领域契约。
    MCP 的 JSON-RPC、工具及传输表面由 mcp.md 与现有消息 Schema 维护。
    业务接口拒绝未声明查询参数；无请求体不等于必须发送 JSON 空对象。
servers:
  - url: /
tags:
  - name: public
    description: 公共健康检查
  - name: agent
    description: 主动出站设备通道
  - name: admin
    description: 同源管理员通道
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [public]
      summary: 读取公共健康状态
      security: []
      externalDocs:
        url: './README.md#http-与-json'
      responses:
        '200':
          $ref: '#/components/responses/HealthReady'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /api/v1/agent/sessions:
    post:
      operationId: agentCreateSession
      tags: [agent]
      summary: 注册临时设备会话
      externalDocs:
        url: './agent.md#注册和本机决定'
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      responses:
        '201':
          description: 注册临时设备会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Remota-Epoch:
              $ref: '#/components/headers/X-Remota-Epoch'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Content-Type-Options:
